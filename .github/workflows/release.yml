name: Релиз

# Сборка и публикация по кнопке. От человека нужна одна вещь — номер версии.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия (например 0.6.0). Ставится в VERSION и в тег vX.Y.Z'
        required: true
        type: string
      prerelease:
        description: 'Черновик для проверки: пометить как pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Проверить формат версии
        run: |
          set -eu
          V='${{ inputs.version }}'
          # Версия попадает не только в имя пакета: build.sh штампует её в ?v= у бандлов и
          # в build-id.txt, по которому загрузчик решает, брать интерфейс из кеша браузера
          # или заново. Опечатка здесь — это «пакет обновился, интерфейс прежний».
          echo "$V" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "::error::версия '$V' не в виде X.Y.Z"; exit 1; }
          echo "$V" > VERSION
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - name: Установить зависимости интерфейса
        working-directory: ui
        run: npm ci

      - name: Проверки интерфейса
        working-directory: ui
        run: |
          set -eu
          # Те же проверки, что и локально. check:cn сверяет свою реализацию tw-merge с
          # настоящей, а check-dist ловит расхождение раскладки бандлов с тем, что ждёт
          # build.sh, — в splify 1 один чанк, доступный по двум URL, стоил мёртвой вкладки.
          npm run lint
          npx tsc -b
          npm run check:cn

      - name: Стенды
        run: |
          set -eu
          # Вариант «а» из splicicd#14: падение стенда гасит релиз. До этого шага
          # workflow прогонял только lint/tsc/check:cn, а npm test не вызывал вовсе —
          # и красный ui-harness (getByText нашёл два «Endpoint») доехал до четырёх
          # релизов подряд, потому что единственным способом узнать о нём был ручной
          # прогон. Цена решения известна и принята: стенд, покрасневший по чужой
          # причине (обновление vitest, сеть на runner'е), останавливает выпуск.
          #
          # Вход один — tests/run.sh, а не перечисление стендов здесь: список стендов
          # живёт в одном месте, иначе новый стенд появляется в репозитории и не
          # появляется в релизе. Пропуск ui-harness сам скрипт считает провалом, так
          # что «зелено» здесь означает, что интерфейс проверен, а не пропущен.
          # protomatch без quickjs пропускается вслух с кодом 0 — на runner'е его нет,
          # и это единственный стенд, для которого пропуск не провал.
          sh tests/run.sh

      - name: Собрать пакет
        run: ./build.sh 2>&1 | tee /tmp/build.log

      - name: Убедиться, что пакет собрался
        run: |
          set -eu
          ls -la out/
          # Оба формата обязательны. Пропустить один легко — сборка от этого не падает,
          # просто половина роутеров (OpenWrt 23.05 и старше, там opkg) остаётся без
          # пакета, и узнаётся это от людей, а не от барьера.
          test -f "out/luci-app-splify2-${VERSION}-1_noarch.apk" || {
            echo "::error::пакет luci-app-splify2-${VERSION}-1_noarch.apk не найден"; exit 1; }
          test -f "out/luci-app-splify2-${VERSION}-1_all.ipk" || {
            echo "::error::пакет luci-app-splify2-${VERSION}-1_all.ipk не найден"; exit 1; }

      - name: Зафиксировать версию в репозитории
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet VERSION; then
            git add VERSION
            git commit -m "Версия ${VERSION}"
            git push
          fi

      - name: Выложить пакеты в ветку dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIST: dist
        run: |
          set -eu
          # ЗАЧЕМ ВТОРАЯ ВЫКЛАДКА, КОГДА ЕСТЬ РЕЛИЗ. splify2#15: провайдер закрывает не
          # GitHub, а `githubusercontent.com`, и закрывает целиком — `raw.`, `objects.` и
          # `release-assets.` стоят на одних адресах Fastly (185.199.108-111.133). Прямая
          # ссылка релиза перенаправляет как раз на `release-assets`, поэтому у такого
          # человека splify2 нельзя ни поставить, ни обновить. `codeload.github.com` живёт
          # на сети самого GitHub (140.82.121.x), отдаёт ветку архивом и никуда не
          # перенаправляет — install.sh и rpcd-объект берут пакеты оттуда, когда прямая
          # ссылка молчит.
          #
          # Ветка сиротская и переписывается каждым релизом: это канал выкладки, а не
          # история. Хранить в ней прошлые пакеты значило бы растить архив, который потом
          # целиком качает роутер ради одного файла.
          rm -rf /tmp/dist
          mkdir -p /tmp/dist
          cp "out/luci-app-splify2-${VERSION}-1_noarch.apk" \
             "out/luci-app-splify2-${VERSION}-1_all.ipk" \
             install.sh /tmp/dist/
          echo "$VERSION" > /tmp/dist/VERSION
          cd /tmp/dist
          git init -q -b "$DIST"
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "Пакеты ${VERSION}"
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" "$DIST:$DIST"

      - name: Опубликовать релиз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: splify2 ${{ env.VERSION }}
          prerelease: ${{ inputs.prerelease }}
          files: |
            out/luci-app-splify2-${{ env.VERSION }}-1_noarch.apk
            out/luci-app-splify2-${{ env.VERSION }}-1_all.ipk
            install.sh
          body: |
            Интерфейс и управление для [steer](https://github.com/xyzmean/steer).

            Установка одной строкой — она же поставит движок, если его нет:

            ```sh
            wget -qO- https://codeload.github.com/xyzmean/splify2/tar.gz/refs/heads/main |
                tar -xzO splify2-main/install.sh | sh
            ```

            Короткий вариант, если `githubusercontent.com` у вас открыт:

            ```sh
            sh -c "$(wget -qO- https://raw.githubusercontent.com/xyzmean/splify2/main/install.sh)"
            ```

            Если провайдер закрыл `githubusercontent.com`, файлы ниже не скачаются: прямая
            ссылка релиза ведёт на `release-assets.githubusercontent.com`. Те же пакеты
            лежат в ветке [`dist`](https://github.com/xyzmean/splify2/tree/dist), и первая
            команда берёт их оттуда сама.

            Пакет один на все роутеры: архитектуры здесь нет, весь бинарный код в движке.
            Форматов два: `.apk` для OpenWrt 24.10 и новее, `.ipk` для 23.05, 22.03 и
            всего, что осталось на opkg. Содержимое одинаковое.

            ```sh
            # OpenWrt 24.10+
            apk add --allow-untrusted ./luci-app-splify2-${{ env.VERSION }}-1_noarch.apk
            # OpenWrt 23.05 и старше
            opkg install ./luci-app-splify2-${{ env.VERSION }}-1_all.ipk
            ```

# Резолверы DNS over HTTPS, перенесённые из Zapret Manager.
#
# ЗАЧЕМ ФАЙЛОМ, А НЕ ТАБЛИЦЕЙ В СКРИПТЕ. Список меняется чаще, чем код вокруг него: резолверы
# появляются, переезжают и умирают. Файл правится и проверяется глазами, а объект rpcd его
# читает; таблица внутри shell означала бы, что добавление резолвера — это правка программы.
#
# ФОРМАТ: id|название|ссылка|bootstrap
#
#   id        — латиницей, цифрами и подчёркиванием: подставляется в имя секции uci.
#   название  — то, что видит человек. Ровно как у менеджера, чтобы выбранное у него и у нас
#               читалось одинаково.
#   ссылка    — resolver_url для https-dns-proxy.
#   bootstrap — адреса, по которым разрешается ИМЯ САМОГО резолвера. Пусто — умолчание
#               пакета: тогда имя резолвера разрешает системный resolver, и на роутере, где
#               DNS уже сломан, DoH не поднимется вовсе. Пусто оно там, где менеджер тоже
#               его не задаёт.
#
# НЕСКОЛЬКО СТРОК С ОДНИМ id — это один пункт с несколькими резолверами: порты (listen_port)
# им раздаются подряд с 5053, как это делает менеджер в doh_def. Так устроен пункт
# «по умолчанию»: Cloudflare и Google рядом, чтобы отказ одного не оставлял роутер без DNS.
#
# Порядок строк — порядок пунктов в интерфейсе. Первым стоит «по умолчанию»: он же и
# предлагается тому, кто ничего не выбирал.

default|По умолчанию (Cloudflare + Google)|https://cloudflare-dns.com/dns-query|1.1.1.1,1.0.0.1,2606:4700:4700::1111,2606:4700:4700::1001
default|По умолчанию (Cloudflare + Google)|https://dns.google/dns-query|8.8.8.8,8.8.4.4,2001:4860:4860::8888,2001:4860:4860::8844
cloudflare|Cloudflare|https://cloudflare-dns.com/dns-query|1.1.1.1,1.0.0.1,2606:4700:4700::1111,2606:4700:4700::1001
